<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudYear — Analytics</title><link rel="manifest" href="../../manifest.json"><link rel="icon" href="../../icon.svg" type="image/svg+xml"><meta name="theme-color" content="#060B18"></head><body>
<script src="../../guard.js" data-role="teacher" data-base="../../"></script>
<div class="shell"><main>
  <div class="k">Institutional staff</div><h1>Analytics</h1>
  <p class="lede">Cohort progress, risk distribution and quiz performance (live).</p>
  <div class="grid">
    <div class="card c4 stat"><div class="v" id="a-prog">0%</div><div class="k">Average progress</div></div>
    <div class="card c4 stat"><div class="v" id="a-risk">0</div><div class="k">At risk</div></div>
    <div class="card c4 stat"><div class="v" id="a-hw">0%</div><div class="k">Homework done</div></div>
    <div class="card c6"><h3>Year groups</h3><div id="years"></div></div>
    <div class="card c6"><h3>Risk distribution</h3><div id="risk"></div></div>
    <div class="card c12"><h3>Quiz activity (30 days)</h3><div id="quiz"></div></div>
  </div>
</main></div>
<script src="../nav.js" data-base="../" data-cur="analytics/"></script>
<script>
(function(){
'use strict';var SY=window.SY;if(!SY)return;var TW=window.TW||{};
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function avg(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):0}
var students=(TW.myStudents&&TW.myStudents())||[];
var M=students.map(function(s){return TW.metrics(s.email)});
$('a-prog').textContent=avg(M.map(function(m){return m.overall}))+'%';
$('a-risk').textContent=M.filter(function(m){return m.risk==='HIGH'||m.risk==='CRITICAL'}).length;
$('a-hw').textContent=avg(M.map(function(m){return m.hw}))+'%';
var byYear={};M.forEach(function(m){(byYear[m.level||'Unassigned']=byYear[m.level||'Unassigned']||[]).push(m.overall)});
$('years').innerHTML=Object.keys(byYear).length?Object.keys(byYear).map(function(y){var a=avg(byYear[y]);var c=a>=65?'var(--good)':a>=45?'var(--warn)':'var(--crit)';return '<div class="row"><span style="width:130px;font-size:12.5px">'+esc(y)+'</span><span class="bar" style="flex:1"><i style="width:'+a+'%;background:'+c+'"></i></span><span style="width:40px;text-align:right;font-size:12px">'+a+'%</span></div>'}).join(''):'<div class="empty">No cohort data yet.</div>';
var risk={LOW:0,MEDIUM:0,HIGH:0,CRITICAL:0};M.forEach(function(m){risk[m.risk]=(risk[m.risk]||0)+1});
$('risk').innerHTML=M.length?['CRITICAL','HIGH','MEDIUM','LOW'].map(function(r){var c=r==='LOW'?'var(--good)':r==='MEDIUM'?'var(--warn)':'var(--crit)';var pct=Math.round(100*(risk[r]||0)/M.length);return '<div class="row"><span style="width:90px;font-size:12.5px">'+r.toLowerCase()+'</span><span class="bar" style="flex:1"><i style="width:'+pct+'%;background:'+c+'"></i></span><span style="width:36px;text-align:right;font-size:12px">'+(risk[r]||0)+'</span></div>'}).join(''):'<div class="empty">No data.</div>';
/* quiz activity */
var quizzes=[];students.forEach(function(s){(SY.readAccount(s.email,'quizzes',[])||[]).forEach(function(q){if(q.when&&(Date.now()-new Date(q.when).getTime())<30*86400000)quizzes.push(q)})});
$('quiz').innerHTML=quizzes.length?('<div class="note" style="font-style:normal">'+quizzes.length+' quizzes taken in the last 30 days · average '+avg(quizzes.map(function(q){return q.pct}))+'%.</div>'):'<div class="empty">No quiz activity in the last 30 days.</div>';
})();
</script>
</body></html>
