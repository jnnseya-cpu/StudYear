<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudYear — Assignments</title><link rel="manifest" href="../../manifest.json"><link rel="icon" href="../../icon.svg" type="image/svg+xml"><meta name="theme-color" content="#060B18"></head><body>
<script src="../../guard.js" data-role="teacher" data-base="../../"></script>
<div class="shell"><main>
  <div class="k">Institutional staff</div><h1>Assignment command centre</h1>
  <p class="lede">School assessments and student homework completion (live).</p>
  <div class="grid">
    <div class="card c6"><h3>School assessments</h3><div class="sub">Set by leadership</div><div id="assess"></div></div>
    <div class="card c6"><h3>Homework snapshot</h3><div class="sub">Cohort completion rate from study tasks</div>
      <div class="stat" style="margin-top:6px"><div class="v" id="hw-pct">0%</div><div class="k">cohort completion rate</div></div>
      <div id="hw-list" style="margin-top:10px"></div>
    </div>
    <div class="card c12"><h3>Set homework for your class</h3>
      <div class="two"><div><label class="f">Title</label><input id="hw-title" placeholder="e.g. Quadratics — 10 questions"></div><div><label class="f">Due</label><input id="hw-due" type="date"></div></div>
      <div style="margin-top:12px"><button class="btn solid" id="hw-set">Set homework</button></div>
      <div id="set-list" style="margin-top:12px"></div>
    </div>
  </div>
</main></div>
<script src="../nav.js" data-base="../" data-cur="assignments/"></script>
<script>
(function(){
'use strict';var SY=window.SY;if(!SY)return;var TW=window.TW||{};
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tt;function toast(t){var e=$('toast');if(!e)return;e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){e.style.opacity=0},2000)}
var students=(TW.myStudents&&TW.myStudents())||[];
var M=students.map(function(s){return TW.metrics(s.email)});
var hwAvg=M.length?Math.round(M.reduce(function(a,m){return a+m.hw},0)/M.length):0;
$('hw-pct').textContent=hwAvg+'%';
$('hw-list').innerHTML=M.length?M.slice(0,8).map(function(m){var c=m.hw>=70?'var(--good)':m.hw>=40?'var(--warn)':'var(--crit)';return '<div class="row"><span style="width:150px">'+esc(SY.accountName(m.email))+'</span><span class="bar" style="flex:1"><i style="width:'+m.hw+'%;background:'+c+'"></i></span><span style="width:40px;text-align:right;font-size:12px">'+m.hw+'%</span></div>'}).join(''):'<div class="empty">No students linked.</div>';
var assess=TW.schoolCode?SY.schoolGet(TW.schoolCode,'assessments',[]):[];
$('assess').innerHTML=assess.length?assess.map(function(a){return '<div class="row"><b>'+esc(a.title||a.name)+'</b><span style="margin-left:auto;color:var(--ink-3)">'+esc(a.date||'')+'</span></div>'}).join(''):'<div class="empty">No assessments yet.</div>';
function drawSet(){var hw=SY.get('teacherHomework',[]);$('set-list').innerHTML=hw.length?hw.slice().reverse().map(function(h){return '<div class="row"><b>'+esc(h.title)+'</b><span style="margin-left:auto;color:var(--ink-3);font-size:11.5px">due '+esc(h.due||'—')+'</span></div>'}).join(''):'';}
$('hw-set').onclick=function(){var t=$('hw-title').value.trim();if(!t){toast('Enter a title');return}var hw=SY.get('teacherHomework',[]);hw.push({title:t,due:$('hw-due').value,set:new Date().toISOString()});SY.set('teacherHomework',hw);SY.log('homework','Homework set',t);$('hw-title').value='';toast('Homework set for your class');drawSet()};
drawSet();
})();
</script>
</body></html>
