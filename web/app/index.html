<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StudYear</title><meta name="theme-color" content="#060B18">
<style>body{background:#060B18;color:#AAB6CC;font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;height:100vh;margin:0}.l{font-family:Georgia,serif;font-size:20px}.l b{color:#4FA6E0}</style></head>
<body><div class="l">⌂ <b class="wm">StudYear</b> — signing you in…</div>
<script>
(function(){var q=new URLSearchParams(location.search);
if(q.get('switch')){try{localStorage.removeItem('sy-session')}catch(e){}location.replace('../auth/');return}
var s=null;try{s=JSON.parse(localStorage.getItem('sy-session'))}catch(e){}
if(s&&s.role&&['student','parent','teacher','tutor','school'].indexOf(s.role)>=0){location.replace('./'+s.role+'/')}
else location.replace('../auth/');})();
</script>
</body></html>
