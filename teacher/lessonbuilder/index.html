<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudYear — AI Lesson Builder</title><link rel="manifest" href="../../manifest.json"><link rel="icon" href="../../icon.svg" type="image/svg+xml"><meta name="theme-color" content="#060B18">
<style>
  .module{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-top:10px;background:rgba(6,11,24,.32)}
  .module h4{font-size:13.5px;color:var(--ink)}.module ul{margin:6px 0 0 18px;font-size:12.5px;color:var(--ink-2)}
  .module .q{font-size:11.5px;color:var(--gold-300);margin-top:6px}
</style></head><body>
<script src="../../guard.js" data-role="teacher" data-base="../../"></script>
<script src="../../ai.js"></script>
<div class="shell"><main>
  <div class="k">Institutional staff</div><h1>AI Course Generator</h1>
  <p class="lede">Let our AI build a structured course with modules, topics and quizzes based on any topic you choose.</p>
  <div class="card">
    <div class="three"><div><label class="f">Study level</label><span id="level-wrap"></span></div><div><label class="f">Topic</label><input id="topic" placeholder="e.g. Forces and motion"></div><div><label class="f">Exam board</label><span id="board-wrap"></span></div></div>
    <div class="note" id="ctx-note" style="margin-top:6px"></div>
    <div style="margin-top:12px"><button class="btn solid" id="gen">Generate a course</button></div>
    <div class="note" id="acu-note"></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Generated course outline</h3><div class="sub">Your AI-generated course appears below</div><div id="out"><div class="empty">Your course outline is waiting to be generated.</div></div></div>
</main></div>
<script src="../nav.js" data-base="../" data-cur="lessonbuilder/"></script>
<script>
(function(){
'use strict';var SY=window.SY;if(!SY)return;var TW=window.TW||{};
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tt;function toast(t){var e=$('toast');if(!e)return;e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){e.style.opacity=0},2200)}
/* Study level & exam board come from the teacher's school-assigned sections. */
var SEC=(TW.assignedSections&&TW.assignedSections())||{subjects:[],levels:[],boards:[]};
function fieldFrom(wrapId,list,fallbackPh,defaults,allowBlank){
  var wrap=$(wrapId);var opts=(list&&list.length)?list:(defaults||[]);
  if(opts.length){wrap.innerHTML='<select style="width:100%">'+(allowBlank?'<option value="">— any —</option>':'')+opts.map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select>';return wrap.firstChild}
  wrap.innerHTML='<input placeholder="'+esc(fallbackPh)+'" style="width:100%">';return wrap.firstChild;
}
var levelEl=fieldFrom('level-wrap',SEC.levels,'GCSE',['Primary','KS3','GCSE','IGCSE','AS','A-level','BTEC','IB']);
var boardEl=fieldFrom('board-wrap',SEC.boards,'AQA',['AQA','Edexcel','OCR','WJEC','Eduqas','CIE','SQA'],true);
levelEl.id='level';boardEl.id='board';
$('ctx-note').innerHTML=(SEC.levels.length||SEC.boards.length)
  ? ('Level &amp; exam board are drawn from your school-assigned sections'+(SEC.schoolName?' at <b style="color:var(--gold-300)">'+esc(SEC.schoolName)+'</b>':'')+'.')
  : ('No school-assigned sections yet — <a href="../register/#sec-school" style="color:var(--gold-300)">link your school</a> to tailor these to what you teach.');
function schoolAcu(){return TW.schoolCode?(SY.schoolGet(TW.schoolCode,'acu',{balance:0}).balance||0):0}
$('acu-note').textContent='Uses 15 ACUs per course — no premium plan required. School pool: '+schoolAcu().toLocaleString()+' ACUs.';
$('gen').onclick=function(){
  var topic=$('topic').value.trim();if(!topic){toast('Enter a topic');return}
  var level=$('level').value.trim()||'this level';var board=$('board').value.trim();
  var pool=schoolAcu();
  /* ACU-gated. The debit (15) is taken centrally by SYAI.ask on success —
     from the school pool when the teacher is linked to a school, otherwise the
     teacher's own wallet. No free AI. */
  if(TW.schoolCode&&pool<15){$('out').innerHTML='<div class="empty">Your school pool has '+pool+' ACUs — 15 needed. Ask your admin to top up in ACU command.</div>';return}
  if(window.SYAI&&SYAI.ready()){
    if(SYAI.canAfford&&!SYAI.canAfford(15,TW.schoolCode||null)){$('out').innerHTML='<div class="empty">Not enough ACUs — 15 needed to build a course. Top up in ACU command.</div>';return}
    $('out').innerHTML='<div class="empty">Writing the course with '+SYAI.provider()+'…</div>';
    SYAI.ask("You are a "+level+" course designer for teachers"+(board?" aligned to the "+board+" exam board":"")+". Produce a 4–6 module course: for each module a '## Module N — <title>' heading, 3–5 concrete subtopics as bullets, and a line '✔ End-of-module quiz: 5 questions'. Real, exam-relevant content. End with a one-line teaching sequence note.","Course topic: "+topic,{maxTokens:1400,pool:TW.schoolCode||undefined,acus:15,label:'AI course: '+topic})
      .then(function(t){$('out').innerHTML='<div class="module">'+SYAI.render(t)+'</div>';SY.log('course','Live AI course generated',topic+' · '+level);if($('acu-note'))$('acu-note').textContent='Uses 15 ACUs per course. School pool: '+schoolAcu().toLocaleString()+' ACUs.';toast('Live AI course generated')})
      .catch(function(){lbStatic(topic,level,board)});
    return;
  }
  lbStatic(topic,level,board);
};
function lbStatic(topic,level,board){
  var mods=[
    {t:'Foundations of '+topic,topics:['Key vocabulary & definitions','Core principles','Why it matters (real-world context)']},
    {t:'Building understanding',topics:['Worked examples','Guided practice','Common misconceptions']},
    {t:'Applying '+topic,topics:['Independent problems','Exam-style questions'+(board?' ('+board+')':''),'Extended / stretch tasks']},
    {t:'Mastery & assessment',topics:['Revision summary','Practice paper','Feedback & next steps']}
  ];
  $('out').innerHTML=mods.map(function(m,i){return '<div class="module"><h4>Module '+(i+1)+' · '+esc(m.t)+'</h4><ul>'+m.topics.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><div class="q">✔ End-of-module quiz: 5 auto-marked questions</div></div>'}).join('');
  SY.log('course','AI course generated',topic+' · '+level);toast('Course generated');
};
})();
</script>
</body></html>
