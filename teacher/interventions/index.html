<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudYear — Interventions</title><link rel="manifest" href="../../manifest.json"><link rel="icon" href="../../icon.svg" type="image/svg+xml"><meta name="theme-color" content="#060B18"></head><body>
<script src="../../guard.js" data-role="teacher" data-base="../../"></script>
<div class="shell"><main>
  <div class="k">Institutional staff</div><h1>Interventions</h1>
  <p class="lede">Live intervention plans from your school leadership, plus the plans you create for at-risk learners.</p>
  <div class="card" style="margin-top:14px"><h3>Create a recovery plan</h3><div class="sub">AI drafts a plan from the student's live data</div>
    <div class="two"><div><label class="f">Student</label><select id="stu"></select></div><div><label class="f">Focus</label><input id="focus" placeholder="e.g. Algebra fundamentals"></div></div>
    <div style="margin-top:12px"><button class="btn solid" id="gen">Generate plan</button></div>
    <div id="draft"></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Active interventions</h3><div id="list"></div></div>
</main></div>
<script src="../nav.js" data-base="../" data-cur="interventions/"></script>
<script>
(function(){
'use strict';var SY=window.SY;if(!SY)return;var TW=window.TW||{};
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tt;function toast(t){var e=$('toast');if(!e)return;e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){e.style.opacity=0},2000)}
var students=(TW.myStudents&&TW.myStudents())||[];
if(!TW.schoolCode){$('list').innerHTML='<div class="empty">No interventions recorded for your school.</div>';}
$('stu').innerHTML='<option value="">— select —</option>'+students.map(function(s){return '<option value="'+esc(s.email)+'">'+esc(SY.accountName(s.email)||s.name||s.email)+'</option>'}).join('');
$('stu').onchange=function(){var m=TW.metrics($('stu').value);if(m&&m.weak)$('focus').value=m.weak};
function draw(){
  var iv=TW.schoolCode?SY.schoolGet(TW.schoolCode,'interventions',[]):[];
  var myEmails=students.map(function(s){return (s.email||'').toLowerCase()});
  var mine=iv.filter(function(i){return myEmails.indexOf((i.student||'').toLowerCase())>=0});
  $('list').innerHTML=mine.length?mine.map(function(i,idx){return '<div class="row"><b>'+esc(SY.accountName(i.student)||i.student)+'</b> <span class="badge info">'+esc(i.status||'active')+'</span><span style="margin-left:auto;font-size:11.5px;color:var(--ink-3)">'+esc(i.reason||i.focus||'')+'</span> <button class="btn sm ghost" data-close="'+idx+'">Close</button></div>'}).join(''):'<div class="empty">No active intervention plans.</div>';
  $('list').querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){var all=SY.schoolGet(TW.schoolCode,'interventions',[]);var target=mine[+b.dataset.close];var j=all.findIndex(function(x){return x.student===target.student&&x.reason===target.reason});if(j>=0){all[j].status='closed';SY.schoolSet(TW.schoolCode,'interventions',all)}toast('Marked resolved');draw()}});
}
$('gen').onclick=function(){
  var email=$('stu').value;if(!email){toast('Select a student');return}
  var m=TW.metrics(email);var focus=$('focus').value.trim()||m.weak||'core skills';
  $('draft').innerHTML='<div style="border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:12px;background:rgba(6,11,24,.32)">'+
    '<b>Recovery plan · '+esc(SY.accountName(email))+'</b><div class="note" style="font-style:normal">Current '+m.overall+'% · homework '+m.hw+'% · focus '+esc(focus)+'</div>'+
    '<ul style="margin:8px 0 0 18px;font-size:13px;color:var(--ink-2)"><li>Week 1: diagnostic re-test on '+esc(focus)+' + 3 targeted lessons.</li><li>Week 2: daily 15-min practice; parent update.</li><li>Week 3: assessment; escalate if &lt;60%.</li></ul>'+
    '<button class="btn solid sm" id="save" style="margin-top:10px">Save &amp; assign</button></div>';
  $('save').onclick=function(){var all=TW.schoolCode?SY.schoolGet(TW.schoolCode,'interventions',[]):[];var _ivnow=new Date().toISOString();all.push({student:email,email:email,name:SY.accountName(email),status:'active',reason:'Attainment '+m.overall+'%',focus:focus,subject:focus,notes:'Recovery focus: '+focus,when:_ivnow,at:_ivnow,by:SY.session.email});if(TW.schoolCode)SY.schoolSet(TW.schoolCode,'interventions',all);SY.log('intervention','Recovery plan created',SY.accountName(email)+' · '+focus);toast('Plan assigned');$('draft').innerHTML='';draw()};
};
draw();
})();
</script>
</body></html>
