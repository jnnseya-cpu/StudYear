<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudYear — Communications</title><link rel="manifest" href="../../manifest.json"><link rel="icon" href="../../icon.svg" type="image/svg+xml"><meta name="theme-color" content="#060B18"></head><body>
<script src="../../guard.js" data-role="teacher" data-base="../../"></script>
<div class="shell"><main>
  <div class="k">Institutional staff</div><h1>Communications</h1>
  <p class="lede">Message parents and students — the AI Parent Communicator drafts updates from live data.</p>
  <div class="card"><h3>Compose</h3>
    <div class="two"><div><label class="f">To</label><select id="to"></select></div><div><label class="f">Type</label><select id="type"><option>Progress update</option><option>Homework reminder</option><option>Praise / good news</option><option>Concern / intervention</option><option>Parents' evening</option></select></div></div>
    <label class="f">Message</label><textarea id="msg" rows="5"></textarea>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="draft">AI draft</button><button class="btn solid" id="send">Send</button></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Sent messages</h3><div id="log"></div></div>
</main></div>
<script src="../nav.js" data-base="../" data-cur="communications/"></script>
<script>
(function(){
'use strict';var SY=window.SY;if(!SY)return;var TW=window.TW||{};
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tt;function toast(t){var e=$('toast');if(!e)return;e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){e.style.opacity=0},2000)}
var students=(TW.myStudents&&TW.myStudents())||[];
$('to').innerHTML='<option value="">— select student / parent —</option>'+students.map(function(s){return '<option value="'+esc(s.email)+'">'+esc(SY.accountName(s.email)||s.name||s.email)+' (parent)</option>'}).join('');
$('draft').onclick=function(){var email=$('to').value;var nm=email?SY.accountName(email):'your child';var m=email?TW.metrics(email):null;var type=$('type').value;
  var body;
  if(type==='Homework reminder')body='Dear parent,\n\nA quick reminder that '+nm+' has homework outstanding'+(m?' (completion '+m.hw+'%)':'')+'. Please encourage 20 minutes tonight. Thank you.';
  else if(type==='Praise / good news')body='Dear parent,\n\nI wanted to share some good news — '+nm+' has been working really well'+(m?' and is at '+m.overall+'%':'')+'. Keep it up!';
  else if(type==='Concern / intervention')body='Dear parent,\n\nI\'d like to discuss '+nm+'\'s progress'+(m&&m.weak?', particularly in '+m.weak:'')+'. I\'m putting a short recovery plan in place and would value your support at home.';
  else if(type==='Parents’ evening')body='Dear parent,\n\nParents’ evening is approaching. I’d love to talk through '+nm+'’s progress and next steps. Please book a slot at your convenience.';
  else body='Dear parent,\n\nHere is this week’s update for '+nm+(m?': attainment '+m.overall+'%, homework '+m.hw+'%'+(m.weak?', focus area '+m.weak:''):'')+'. '+nm+' is making steady progress. Do get in touch with any questions.';
  $('msg').value=body+'\n\nBest wishes,\n'+((TW.profile&&TW.profile.name)||SY.session.name);
};
function drawLog(){var log=SY.get('teacherMessages',[]);$('log').innerHTML=log.length?log.slice().reverse().slice(0,10).map(function(l){return '<div class="row"><b>'+esc(l.to)+'</b> <span class="badge info">'+esc(l.type)+'</span><span style="margin-left:auto;color:var(--ink-3);font-size:11.5px">'+SY.timeAgo(l.when)+'</span></div>'}).join(''):'<div class="empty">No messages sent yet.</div>';}
$('send').onclick=function(){var to=$('to').value;if(!to){toast('Select a recipient');return}if(!$('msg').value.trim()){toast('Write or draft a message');return}var log=SY.get('teacherMessages',[]);log.push({to:SY.accountName(to)||to,type:$('type').value,body:$('msg').value,when:new Date().toISOString()});SY.set('teacherMessages',log);SY.log('message','Message sent',SY.accountName(to)+' · '+$('type').value);$('msg').value='';toast('Message sent');drawLog()};
drawLog();
})();
</script>
</body></html>
