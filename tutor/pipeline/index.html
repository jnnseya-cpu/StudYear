<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudYear — Student Pipeline</title><link rel="manifest" href="../../manifest.json"><link rel="icon" href="../../icon.svg" type="image/svg+xml"><meta name="theme-color" content="#060B18">
<style>
  .pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}@media(max-width:1000px){.pipe{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.pipe{grid-template-columns:1fr 1fr}}
  .stage .drop{color:var(--ink-3);font-size:11px;font-style:italic;border:1px dashed rgba(170,182,204,.16);border-radius:8px;padding:12px 6px;text-align:center}
  .stage{border:1px solid var(--line);border-radius:12px;background:rgba(6,11,24,.32);padding:10px;min-height:150px}
  .stage.over{border-color:var(--gold-500);background:rgba(77,157,224,.08)}
  .stage h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;margin-bottom:8px}
  .lead{border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:7px;background:rgba(16,27,51,.5);cursor:grab;font-size:12.5px}
  .lead b{display:block;color:var(--ink)}.lead .s{color:var(--ink-3);font-size:11px}
</style></head><body>
<script src="../../guard.js" data-role="tutor" data-base="../../"></script>
<div class="shell"><main>
  <div class="k">Teaching operator</div><h1>Student pipeline</h1>
  <p class="lede">CRM for leads, trials, active learners and premium conversions. Drag between stages.</p>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><input id="nm" placeholder="Student name" style="max-width:220px"><input id="sj" placeholder="Subject" style="max-width:180px"><button class="btn solid sm" id="add">Add lead</button></div>
  <div class="pipe" id="pipe"></div>
</main></div>
<script src="../nav.js" data-base="../" data-cur="pipeline/"></script>
<script>
(function(){
'use strict';var SY=window.SY;if(!SY)return;
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tt;function toast(t){var e=$('toast');if(!e)return;e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){e.style.opacity=0},2000)}
var STAGES=['enquiry','trial','active','atrisk','inactive','premium'];var LABELS={enquiry:'New enquiry',trial:'Trial',active:'Active',atrisk:'At risk',inactive:'Inactive',premium:'Premium'};
var students=SY.get('tutorStudents',[]);
function draw(){
  $('pipe').innerHTML=STAGES.map(function(st){var list=students.map(function(s,i){return {s:s,i:i}}).filter(function(o){return (o.s.stage||'lead')===st});
    return '<div class="stage" data-stage="'+st+'"><h4>'+LABELS[st]+' <span>'+list.length+'</span></h4><div class="lst" data-lst="'+st+'">'+
      (list.length?list.map(function(o){return '<div class="lead" draggable="true" data-idx="'+o.i+'"><b>'+esc(o.s.name)+'</b><span class="s">'+esc((o.s.subjects&&o.s.subjects[0])||o.s.subject||'General')+(o.s.progress?' · '+o.s.progress+'%':'')+'</span></div>'}).join(''):'<div class="drop">Drop students here</div>')+
      '</div></div>';
  }).join('');
  document.querySelectorAll('.lead').forEach(function(el){el.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',el.dataset.idx)})});
  document.querySelectorAll('.stage').forEach(function(col){
    col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',function(){col.classList.remove('over')});
    col.addEventListener('drop',function(e){e.preventDefault();col.classList.remove('over');var idx=+e.dataTransfer.getData('text/plain');if(students[idx]){students[idx].stage=col.dataset.stage;SY.set('tutorStudents',students);toast(students[idx].name+' → '+LABELS[col.dataset.stage]);draw()}});
  });
}
$('add').onclick=function(){var nm=$('nm').value.trim();if(!nm){toast('Enter a name');return}students.push({name:nm,subject:$('sj').value.trim()||'General',subjects:[$('sj').value.trim()||'General'],stage:'enquiry'});SY.set('tutorStudents',students);$('nm').value='';$('sj').value='';toast('Lead added');draw()};
draw();
})();
</script>
</body></html>
