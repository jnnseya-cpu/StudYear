name: Component Screenshots

# Captures a screenshot of every StudYear surface (admin + every user role) from
# the production static export and uploads them as a downloadable artifact.
on:
  workflow_dispatch:
  push:
    branches: [claude/continue-from-here-y37pvu]
    paths:
      - 'apps/web/public/**'
      - 'scripts/screenshots.mjs'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspaces
        run: npm install
      - name: Build static OS
        run: npm run build:pages
      - name: Install Chromium
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Capture component screenshots
        run: node scripts/screenshots.mjs
      - name: Commit gallery into the repo (viewable inline on GitHub)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "docs: refresh component screenshot gallery [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload screenshot gallery (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: studyear-component-screenshots
          path: docs/screenshots/
          if-no-files-found: error
