# Manual, gated backend deployment (go-live architecture §15):
# staging deploys freely; production is a deliberate button-press with the
# target spelled out. Requires the FIREBASE_SERVICE_ACCOUNT repo secret —
# a service-account JSON from the matching Firebase project with the
# "Firebase Admin" + "Cloud Functions Admin" roles.
name: Deploy Backend (Firebase)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Firebase project alias (backend/.firebaserc)'
        required: true
        # production is the default: the live stack is revision-rocket-4nuir;
        # the studyear-staging project was never created (deploys to it 400)
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck functions
        run: npm run typecheck --workspace backend/functions
      - name: Write service-account credentials
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Provision runtime env (AI + mail keys from repo secrets)
        # Only non-empty secrets land in backend/functions/.env, which
        # firebase-tools bundles into the Functions runtime. Missing keys just
        # leave that feature dormant (aiProxy → 503, contact → store-only).
        # The AI key is auto-detected: AI_PROVIDER_KEY wins, otherwise any of
        # the common provider secret names below is picked up with the right
        # provider inferred — so keys work whatever they were saved as.
        env:
          K_AI: ${{ secrets.AI_PROVIDER_KEY }}
          K_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          K_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          K_CLAUDE: ${{ secrets.CLAUDE_API_KEY }}
          K_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          K_GOOGLE: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          AIP="${{ secrets.AI_PROVIDER }}"; AIK="$K_AI"; SRC="AI_PROVIDER_KEY"
          if [ -z "$AIK" ]; then
            if   [ -n "$K_OPENAI" ];    then AIP="${AIP:-openai}";    AIK="$K_OPENAI";    SRC="OPENAI_API_KEY"
            elif [ -n "$K_ANTHROPIC" ]; then AIP="${AIP:-anthropic}"; AIK="$K_ANTHROPIC"; SRC="ANTHROPIC_API_KEY"
            elif [ -n "$K_CLAUDE" ];    then AIP="${AIP:-anthropic}"; AIK="$K_CLAUDE";    SRC="CLAUDE_API_KEY"
            elif [ -n "$K_GEMINI" ];    then AIP="${AIP:-gemini}";    AIK="$K_GEMINI";    SRC="GEMINI_API_KEY"
            elif [ -n "$K_GOOGLE" ];    then AIP="${AIP:-gemini}";    AIK="$K_GOOGLE";    SRC="GOOGLE_API_KEY"
            fi
          fi
          if [ -n "$AIK" ]; then echo "AI gateway key: found ($SRC → provider $AIP)"; else echo "AI gateway key: NOT FOUND — set AI_PROVIDER_KEY (or OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY)"; fi
          {
            for kv in \
              "AI_PROVIDER=$AIP" \
              "AI_PROVIDER_KEY=$AIK" \
              "AI_MODEL=${{ secrets.AI_MODEL }}" \
              "MAIL_HOST=${{ secrets.MAIL_HOST }}" \
              "MAIL_PORT=${{ secrets.MAIL_PORT }}" \
              "MAIL_USER=${{ secrets.MAIL_USER }}" \
              "MAIL_PASS=${{ secrets.MAIL_PASS }}" \
              "MAIL_FROM=${{ secrets.MAIL_FROM }}" \
              "MAIL_TO=${{ secrets.MAIL_TO }}" \
              "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
              "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"; do
              [ -n "${kv#*=}" ] && echo "$kv"
            done
          } > backend/functions/.env || true
          echo "provisioned $(grep -c '=' backend/functions/.env || echo 0) key(s)"
      - name: Deploy functions + Firestore rules/indexes
        id: deploy
        working-directory: backend
        continue-on-error: true
        run: |
          set -o pipefail
          npx firebase-tools deploy --only functions,firestore --project ${{ inputs.target }} --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - name: Deploy Storage rules (best-effort — needs the default bucket + IAM)
        if: steps.deploy.outcome == 'success'
        working-directory: backend
        continue-on-error: true
        run: npx firebase-tools deploy --only storage --project ${{ inputs.target }} --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - name: Smoke-test the deployment
        if: steps.deploy.outcome == 'success'
        run: node scripts/verify-deployment.mjs
        env:
          SY_API_BASE: ${{ vars.SY_API_BASE }}
      - name: Outcome
        # The robot (FIREBASE_SERVICE_ACCOUNT) may not be authorised yet.
        # That has ZERO impact — the backend simply stays on its current
        # version — so it must not read as a scary failure. Green + notice.
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "## ✅ Backend deployed to ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -qEi "Missing permissions|iam\.serviceAccounts\.ActAs|caller does not have permission|Permission .* denied" "$RUNNER_TEMP/deploy.log"; then
            {
              echo "## ⚠️ Skipped — deploy robot not authorised yet (no impact)"
              echo ""
              echo "**Nothing changed**: the backend keeps running its current version (last deployed from Cloud Shell)."
              echo ""
              echo "To enable one-click deploys, run this once in [Cloud Shell](https://console.cloud.google.com/?project=revision-rocket-4nuir&cloudshell=true):"
              echo ""
              echo '```bash'
              echo 'for R in roles/editor roles/iam.serviceAccountUser roles/firebase.admin; do'
              echo '  gcloud projects add-iam-policy-binding revision-rocket-4nuir \'
              echo '    --member="serviceAccount:firebase-adminsdk-fbsvc@revision-rocket-4nuir.iam.gserviceaccount.com" \'
              echo '    --role="$R" --condition=None --quiet'
              echo 'done'
              echo 'gcloud iam service-accounts add-iam-policy-binding revision-rocket-4nuir@appspot.gserviceaccount.com \'
              echo '  --member="serviceAccount:firebase-adminsdk-fbsvc@revision-rocket-4nuir.iam.gserviceaccount.com" \'
              echo '  --role="roles/iam.serviceAccountUser" --project=revision-rocket-4nuir --quiet'
              echo '```'
              echo ""
              echo "Until then, deploy the backend from Cloud Shell: \`cd ~/StudYear && git pull && cd backend && npx firebase-tools deploy --project revision-rocket-4nuir --non-interactive --force\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Backend NOT deployed — the robot account lacks IAM roles. No impact; see the run summary for the one-time enable command."
            exit 0
          fi
          echo "## ❌ Deploy failed — see the log above (not a permissions issue)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
