name: Verify StudYear OS

on:
  push:
    branches: [main, claude/continue-from-here-y37pvu]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspaces
        run: npm install
      - name: Typecheck shared + web + backend functions
        run: |
          npm run typecheck --workspace apps/web
          npm run typecheck --workspace backend/functions
      - name: Build static OS
        run: npm run build:pages
      - name: Install Chromium for e2e
        # Use the repo's OWN playwright-core to install its matching browser build,
        # so the launched executable always exists (a hardcoded playwright@X.Y.Z
        # installs a different build than playwright-core expects → "executable
        # doesn't exist"). Then point the tests at that exact binary.
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Run e2e verification (12 suites + full-site crawl)
        run: node tests/run.mjs
