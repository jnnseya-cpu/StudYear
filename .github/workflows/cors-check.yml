# One-off diagnostic: does the backend return CORS headers for a cross-origin
# call from www.studyear.com? Run via workflow_dispatch; read the logs. Safe
# (read-only probes with a dummy token). Can be deleted after diagnosis.
name: CORS check (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [claude/continue-from-here-y37pvu]
    paths: ['.github/workflows/cors-check.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight (OPTIONS) to platformConfig
        run: |
          echo "===== OPTIONS /platformConfig (preflight) ====="
          curl -sS -i -X OPTIONS \
            "https://europe-west2-revision-rocket-4nuir.cloudfunctions.net/platformConfig" \
            -H "Origin: https://www.studyear.com" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            --max-time 30 | sed -n '1,40p' || true
      - name: POST to platformConfig (expect 401 + CORS header)
        run: |
          echo "===== POST /platformConfig ====="
          curl -sS -i -X POST \
            "https://europe-west2-revision-rocket-4nuir.cloudfunctions.net/platformConfig" \
            -H "Origin: https://www.studyear.com" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer diagnostic-dummy" \
            -d '{"op":"status"}' --max-time 30 | sed -n '1,40p' || true
      - name: POST to aiProxy (expect 401 + CORS header)
        run: |
          echo "===== POST /aiProxy ====="
          curl -sS -i -X POST \
            "https://europe-west2-revision-rocket-4nuir.cloudfunctions.net/aiProxy" \
            -H "Origin: https://www.studyear.com" \
            -H "Content-Type: application/json" \
            -d '{}' --max-time 30 | sed -n '1,40p' || true
      - name: GET health (baseline)
        run: |
          echo "===== GET /health ====="
          curl -sS -i "https://europe-west2-revision-rocket-4nuir.cloudfunctions.net/health" \
            -H "Origin: https://www.studyear.com" --max-time 30 | sed -n '1,30p' || true
