name: Deploy StudYear OS

on:
  push:
    branches: [claude/studyear-ecosystem-architecture-f4lu5m, main, claude/continue-from-here-y37pvu]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspaces
        run: npm install
      - name: Typecheck shared contracts + web
        run: npm run typecheck --workspace apps/web
      - name: Build static OS (GitHub Pages target)
        run: STATIC_EXPORT=1 PAGES_BASE_PATH=/StudYear npm run build --workspace apps/web
      - name: Landing page at the root + Pages plumbing
        run: |
          cp apps/web/public/landing.html apps/web/out/index.html
          touch apps/web/out/.nojekyll
      # The default GITHUB_TOKEN cannot create a Pages site via the API
      # (configure-pages enablement fails with "Resource not accessible by
      # integration"), but publishing a gh-pages branch enables branch-based
      # Pages automatically on public repos.
      - name: Publish to gh-pages
        run: |
          cd apps/web/out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy StudYear OS from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
